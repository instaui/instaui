name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn check:docs
      - run: yarn check:version
      - run: yarn check:package

  compat:
    # Peer-range lanes: type-check and test against the edges of the declared peer ranges.
    name: compat (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: antd 5.25 (floor)
            deps: antd@5.25.0 @ant-design/icons@5.6.1
          - lane: antd 5.29 (latest-5)
            deps: antd@5.29.3 @ant-design/icons@^5.6.1
          - lane: react 18
            deps: react@^18.3.1 react-dom@^18.3.1 @types/react@^18.3.0 @types/react-dom@^18.3.0
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install
      - run: yarn add --dev ${{ matrix.deps }}
      - run: yarn typecheck
      - run: yarn test
